server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: demo-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: demo-app
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            endpoint: endpoint
            message: message
            trace_id: trace_id
            status: status
            duration_ms: duration_ms
      - labels:
          level:
          endpoint:
          status:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
