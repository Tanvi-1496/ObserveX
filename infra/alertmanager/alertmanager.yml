global:
  resolve_timeout: 1m

route:
  group_by: ["alertname", "endpoint", "severity"]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "observex-api-webhook"

receivers:
  - name: "observex-api-webhook"
    webhook_configs:
      - url: "http://observex-api:8000/api/webhooks/alertmanager"
        send_resolved: true
